<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseBoard — Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3f8;
    --panel: #ffffff;
    --ink: #1e2130;
    --muted: #6b6d80;
    --line: #e6e5ee;
    --brand: #5b47e0;
    --brand-dark: #4735b8;
    --brand-soft: #efeafd;

    --high: #c8483a;
    --high-soft: #fbeae8;
    --medium: #c07f1e;
    --medium-soft: #fbf1de;
    --low: #2f8f6b;
    --low-soft: #e6f5ee;

    --todo-tint: #f1f0f6;
    --progress-tint: #eee9fd;
    --done-tint: #e9f6ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  header.topbar {
    background: var(--ink);
    color: #f3f2fa;
    padding: 20px 32px;
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .brand { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
  .brand span { color: #a898ff; }
  .stat-row { display: flex; gap: 22px; }
  .stat { text-align: right; }
  .stat .n { font-size: 1.2rem; font-weight: 700; }
  .stat .l { font-size: 0.7rem; color: #9c9ab3; text-transform: uppercase; letter-spacing: 0.04em; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px; margin-bottom: 26px; }
  .panel-title { font-size: 0.95rem; font-weight: 700; margin: 0 0 16px; }

  .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 5px; }
  .field.narrow { max-width: 150px; flex: 0 0 150px; }
  .field label { font-size: 0.74rem; color: var(--muted); font-weight: 600; }
  .field input, .field select, .field textarea {
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 0.9rem; font-family: inherit; background: #fbfaff; color: var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  .btn { border: none; border-radius: 6px; padding: 10px 18px; font-size: 0.87rem; font-weight: 600; cursor: pointer; }
  .btn-brand { background: var(--brand); color: #fff; }
  .btn-brand:hover { background: var(--brand-dark); }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 6px 12px; font-size: 0.8rem; }
  .btn-ghost:hover { background: var(--bg); }
  .btn-text { background: none; border: none; color: var(--muted); font-size: 0.78rem; cursor: pointer; padding: 4px 6px; }
  .btn-text:hover { color: var(--high); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 12px; }
  .filter-pills { display: flex; gap: 8px; }
  .pill { border: 1px solid var(--line); background: var(--panel); padding: 6px 14px; font-size: 0.78rem; border-radius: 20px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .pill.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .search-input { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 0.85rem; width: 220px; font-family: inherit; }

  .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .column { background: transparent; }
  .column-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; }
  .column-head h3 { font-size: 0.85rem; margin: 0; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  .column-count { font-size: 0.75rem; background: var(--line); padding: 2px 9px; border-radius: 10px; color: var(--muted); font-weight: 700; }

  .column-body { border-radius: 10px; padding: 10px; min-height: 80px; display: flex; flex-direction: column; gap: 10px; }
  .column-body.todo { background: var(--todo-tint); }
  .column-body.in_progress { background: var(--progress-tint); }
  .column-body.done { background: var(--done-tint); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .card h4 { margin: 0; font-size: 0.92rem; line-height: 1.3; }
  .card.done h4 { text-decoration: line-through; color: var(--muted); }
  .card p { margin: 6px 0 10px; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }

  .badge { font-size: 0.68rem; font-weight: 700; padding: 3px 9px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
  .badge.high { background: var(--high-soft); color: var(--high); }
  .badge.medium { background: var(--medium-soft); color: var(--medium); }
  .badge.low { background: var(--low-soft); color: var(--low); }

  .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
  .card-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

  .empty-col { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 24px 10px; }

  .status-msg { font-size: 0.83rem; margin-top: 10px; }
  .status-msg.error { color: var(--high); }
  .status-msg.ok { color: var(--low); }

  footer { text-align: center; font-size: 0.78rem; color: var(--muted); padding: 24px; }

  @media (max-width: 900px) {
    .board { grid-template-columns: 1fr; }
    .stat-row { display: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Pulse<span>Board</span></div>
    <div class="stat-row" id="stat-row">
      <div class="stat"><div class="n" id="stat-total">0</div><div class="l">Total</div></div>
      <div class="stat"><div class="n" id="stat-todo">0</div><div class="l">To Do</div></div>
      <div class="stat"><div class="n" id="stat-progress">0</div><div class="l">In Progress</div></div>
      <div class="stat"><div class="n" id="stat-done">0</div><div class="l">Done</div></div>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="panel">
    <h2 class="panel-title">New Task</h2>
    <form class="form-row" id="task-form">
      <div class="field" style="flex:2;">
        <label>Title</label>
        <input id="f-title" placeholder="Write the deployment report" required>
      </div>
      <div class="field" style="flex:2;">
        <label>Description</label>
        <input id="f-desc" placeholder="Optional details">
      </div>
      <div class="field narrow">
        <label>Priority</label>
        <select id="f-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="field narrow">
        <label>Due date</label>
        <input id="f-due" type="date">
      </div>
      <button type="submit" class="btn btn-brand">Add Task</button>
    </form>
    <div id="form-status" class="status-msg"></div>
  </section>

  <div class="toolbar">
    <div class="filter-pills" id="filter-pills">
      <button class="pill active" data-priority="all">All Priorities</button>
      <button class="pill" data-priority="high">High</button>
      <button class="pill" data-priority="medium">Medium</button>
      <button class="pill" data-priority="low">Low</button>
    </div>
    <input type="text" class="search-input" id="search-input" placeholder="Search tasks…">
  </div>

  <div id="board-status" class="status-msg"></div>
  <div class="board" id="board"></div>

</div>

<footer>PulseBoard — Node.js, Express, MySQL &amp; Docker</footer>

<script>
  const API_URL = '/api/tasks';
  let tasks = [];
  let activePriority = 'all';
  let searchTerm = '';

  const COLUMNS = [
    { key: 'todo', label: 'To Do' },
    { key: 'in_progress', label: 'In Progress' },
    { key: 'done', label: 'Done' }
  ];

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function formatDate(d) {
    if (!d) return 'No due date';
    const date = new Date(d);
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  async function loadTasks() {
    const statusEl = document.getElementById('board-status');
    statusEl.textContent = '';
    statusEl.className = 'status-msg';
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('Server responded with ' + res.status);
      tasks = await res.json();
      renderStats();
      renderBoard();
    } catch (err) {
      statusEl.textContent = 'Could not load tasks. Is the backend running?';
      statusEl.className = 'status-msg error';
    }
  }

  function renderStats() {
    document.getElementById('stat-total').textContent = tasks.length;
    document.getElementById('stat-todo').textContent = tasks.filter(t => t.status === 'todo').length;
    document.getElementById('stat-progress').textContent = tasks.filter(t => t.status === 'in_progress').length;
    document.getElementById('stat-done').textContent = tasks.filter(t => t.status === 'done').length;
  }

  function filteredTasks() {
    return tasks.filter(t => {
      const matchesPriority = activePriority === 'all' || t.priority === activePriority;
      const matchesSearch = !searchTerm || t.title.toLowerCase().includes(searchTerm) || (t.description || '').toLowerCase().includes(searchTerm);
      return matchesPriority && matchesSearch;
    });
  }

  function renderBoard() {
    const board = document.getElementById('board');
    const visible = filteredTasks();

    board.innerHTML = COLUMNS.map(col => {
      const colTasks = visible.filter(t => t.status === col.key);
      return `
        <div class="column">
          <div class="column-head">
            <h3>${col.label}</h3>
            <span class="column-count">${colTasks.length}</span>
          </div>
          <div class="column-body ${col.key}">
            ${colTasks.length === 0 ? '<div class="empty-col">Nothing here</div>' : colTasks.map(t => renderCard(t, col.key)).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  function renderCard(t, colKey) {
    const moves = COLUMNS.filter(c => c.key !== colKey);
    return `
      <div class="card ${t.status === 'done' ? 'done' : ''}">
        <div class="card-top">
          <h4>${escapeHtml(t.title)}</h4>
          <span class="badge ${t.priority}">${t.priority}</span>
        </div>
        ${t.description ? `<p>${escapeHtml(t.description)}</p>` : ''}
        <div class="card-meta">
          <span>${formatDate(t.due_date)}</span>
        </div>
        <div class="card-actions">
          ${moves.map(m => `<button class="btn-ghost" onclick="moveTask(${t.id}, '${m.key}')">Move to ${m.label}</button>`).join('')}
          <button class="btn-text" onclick="deleteTask(${t.id})">Delete</button>
        </div>
      </div>
    `;
  }

  async function moveTask(id, newStatus) {
    try {
      const res = await fetch(`${API_URL}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      if (!res.ok) throw new Error('Server responded with ' + res.status);
      loadTasks();
    } catch (err) {
      document.getElementById('board-status').textContent = 'Could not move task.';
      document.getElementById('board-status').className = 'status-msg error';
    }
  }

  async function deleteTask(id) {
    if (!confirm('Delete this task?')) return;
    try {
      const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Server responded with ' + res.status);
      loadTasks();
    } catch (err) {
      document.getElementById('board-status').textContent = 'Could not delete task.';
      document.getElementById('board-status').className = 'status-msg error';
    }
  }

  document.getElementById('task-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById('form-status');
    const title = document.getElementById('f-title').value.trim();
    const description = document.getElementById('f-desc').value.trim();
    const priority = document.getElementById('f-priority').value;
    const due_date = document.getElementById('f-due').value || null;

    if (!title) {
      statusEl.textContent = 'Title is required.';
      statusEl.className = 'status-msg error';
      return;
    }

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, priority, due_date })
      });
      if (!res.ok) throw new Error('Server responded with ' + res.status);
      document.getElementById('task-form').reset();
      document.getElementById('f-priority').value = 'medium';
      statusEl.textContent = 'Task added.';
      statusEl.className = 'status-msg ok';
      loadTasks();
    } catch (err) {
      statusEl.textContent = 'Could not add task.';
      statusEl.className = 'status-msg error';
    }
  });

  document.getElementById('filter-pills').addEventListener('click', (e) => {
    if (e.target.classList.contains('pill')) {
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      activePriority = e.target.dataset.priority;
      renderBoard();
    }
  });

  document.getElementById('search-input').addEventListener('input', (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderBoard();
  });

  loadTasks();
</script>

</body>
</html>
